name: Release

# 推 v* 标签时打包并发布 Release；也支持在 Actions 页面手动跑一次（只留档不发版）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# gh release create 需要写权限
permissions:
  contents: write

env:
  # CI 的 runner 能直连 GitHub，不要用国内镜像（scripts/dist.mjs 里的默认值
  # 是 npmmirror，这里显式覆盖掉）
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # action 的主版本按「声明 node24 的最低版本」选，别再往下降 ——
      # 低一档会在每个 run 里收到 "Node.js 20 is deprecated" 告警，
      # 而且 GH 会把这些 action 强制跑在同它声明不一致的 node 上。
      #   checkout v5 · setup-node v5 · pnpm/action-setup v5  → node24
      #   upload-artifact v6 · download-artifact v7            → node24
      #     （这两个的 v5 仍是 node20，所以要各多跳一档）
      - uses: actions/checkout@v5

      # 必须放在 setup-node 之前 —— 后面的 cache: pnpm 依赖它。
      #
      # 这里**故意不写** with.version：package.json 的 packageManager 已经钉了
      # pnpm@10.34.5，action 会自己读它。两处都写的话，新版 action-setup 会判成
      # "Multiple versions of pnpm specified" 直接失败（v0.2.1 首发就是这么挂的：
      # 浮动主版本标签下，action 自身的升级会悄悄改变行为）。
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 核心逻辑自检
        run: pnpm test:core

      # package.json 的 dist 脚本里已经带了 --publish never。
      # 少了它，electron-builder 在 CI + tag 环境下会「隐式发布」，
      # 抢在 gh release 之前失败，把整个打包步骤带崩。
      - name: 打包
        run: pnpm dist

      - uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: |
            release/*-setup.exe
            release/*-portable.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # latest.yml 与 blockmap 都不能少：应用内的更新检查先去 Release 拉清单
      # 才知道有没有新版本，blockmap 是差分下载用的 —— 只传 exe 的话，
      # 用户点「检查更新」永远会得到「找不到版本信息」。
      # Windows runner 默认 shell 是 pwsh、通配符不展开，这里显式用 bash。
      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # 重跑同一个 tag 时 Release 可能已经存在 —— 直接 create 会失败，
          # 存在就改走 upload --clobber，让重跑是幂等的。
          # 资产列表必须写成字面量：放进变量后 bash 不会替它做通配符展开。
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/*-setup.exe dist/*-portable.exe dist/latest.yml dist/*.blockmap \
              --repo "$REPO" --clobber
          else
            gh release create "$TAG" \
              dist/*-setup.exe dist/*-portable.exe dist/latest.yml dist/*.blockmap \
              --repo "$REPO" --generate-notes
          fi
