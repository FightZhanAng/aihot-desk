name: Release

# 推 v* 标签时打包并发布 Release；也支持在 Actions 页面手动跑一次（只留档不发版）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# gh release create 需要写权限
permissions:
  contents: write

env:
  # CI 的 runner 能直连 GitHub，不要用国内镜像（scripts/dist.mjs 里的默认值
  # 是 npmmirror，这里显式覆盖掉）
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 必须放在 setup-node 之前 —— 后面的 cache: pnpm 依赖它
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 核心逻辑自检
        run: pnpm test:core

      # package.json 的 dist 脚本里已经带了 --publish never。
      # 少了它，electron-builder 在 CI + tag 环境下会「隐式发布」，
      # 抢在 gh release 之前失败，把整个打包步骤带崩。
      - name: 打包
        run: pnpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/*-setup.exe
            release/*-portable.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # latest.yml 与 blockmap 都不能少：应用内的更新检查先去 Release 拉清单
      # 才知道有没有新版本，blockmap 是差分下载用的 —— 只传 exe 的话，
      # 用户点「检查更新」永远会得到「找不到版本信息」。
      # Windows runner 默认 shell 是 pwsh、通配符不展开，这里显式用 bash。
      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*-setup.exe dist/*-portable.exe dist/latest.yml dist/*.blockmap \
            --repo "${{ github.repository }}" \
            --generate-notes
